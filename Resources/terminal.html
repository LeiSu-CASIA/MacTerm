<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="xterm.css"><style>
:root{color-scheme:dark;--terminal-bg:#10151f;--terminal-fg:#dce5f3;--accent:#70decb;--panel-bg:#202b3c;--panel-border:#34445a;--muted:#aab9ce;--field-bg:#141c29;--scroll-thumb:#334155}.xterm-viewport::-webkit-scrollbar{width:8px}.xterm-viewport::-webkit-scrollbar-track{background:var(--terminal-bg)}.xterm-viewport::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:5px}.xterm-viewport::-webkit-scrollbar-thumb:hover{background:var(--muted)}
html,body{margin:0;background:var(--terminal-bg);width:100%;height:100%;overflow:hidden}#terminal{position:absolute;inset:16px 18px}#search{display:none;position:absolute;right:12px;top:6px;z-index:10;background:var(--panel-bg);color:var(--terminal-fg);padding:12px;border:1px solid var(--panel-border);border-radius:10px;font:12px system-ui;box-shadow:0 8px 28px #0006}#search input[type=text]{width:170px}button{cursor:pointer;background:var(--field-bg);color:var(--terminal-fg);border:0;border-radius:5px;padding:5px 9px}#query{background:var(--field-bg);border:1px solid var(--panel-border);color:var(--terminal-fg);border-radius:5px;padding:6px}#query:focus{outline:1px solid var(--accent)}#search label{display:inline-block;margin-top:9px;color:var(--muted)}#result{color:var(--accent)}#result{min-width:55px;display:inline-block}
#terminal-menu{position:fixed;z-index:30;box-sizing:border-box;width:230px;max-width:calc(100vw - 8px);max-height:calc(100vh - 8px);overflow:auto;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:9px;padding:5px;box-shadow:0 10px 28px #0008;font:12px system-ui}#terminal-menu[hidden],#terminal-notice[hidden]{display:none}#terminal-menu button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;text-align:left;padding:8px;background:transparent}#terminal-menu button:hover:not(:disabled),#terminal-menu button:focus-visible{background:var(--field-bg);outline:1px solid var(--accent)}#terminal-menu button:disabled{opacity:.4;cursor:default}#terminal-menu button span:last-child{color:var(--muted);font-size:11px}#terminal-notice{position:absolute;bottom:14px;right:16px;z-index:40;max-width:70%;background:var(--panel-bg);color:var(--terminal-fg);border:1px solid var(--panel-border);border-radius:8px;padding:10px;font:12px system-ui}
</style></head><body><div id="terminal"></div><div id="search"><input id="query" type="text" placeholder="搜索终端记录" aria-label="搜索终端记录"><button id="previous">↑</button><button id="next">↓</button><button id="close">×</button><br><label><input id="case" type="checkbox">区分大小写</label><label><input id="regex" type="checkbox">正则</label><label><input id="word" type="checkbox">全词</label><span id="result"></span></div>
<script src="xterm-version.js"></script><script src="terminal-recording.js"></script><script src="terminal-interaction.js"></script><script src="terminal-settings.js"></script><script src="terminal-highlights.js"></script><script src="xterm.js"></script><script src="addon-fit.js"></script><script src="addon-search.js"></script><script>
const terminal=new Terminal({cursorBlink:true,fontSize:14,fontFamily:'Menlo, monospace',scrollback:10000,lineHeight:1.18,theme:{background:'#10151f',foreground:'#dce5f3',cursor:'#70decb',selectionBackground:'#304b59',selectionForeground:'#dce5f3',black:'#243044',red:'#f38ba8',green:'#a6da95',yellow:'#eed49f',blue:'#8aadf4',magenta:'#c6a0f6',cyan:'#70decb',white:'#dce5f3',brightBlack:'#67758c',brightRed:'#f5a1b7',brightGreen:'#b9e5a9',brightYellow:'#f4deb2',brightBlue:'#a3bdfa',brightMagenta:'#d5b7fa',brightCyan:'#98e7db',brightWhite:'#ffffff'},allowProposedApi:true});
const fit=new FitAddon.FitAddon(),search=new SearchAddon.SearchAddon();terminal.loadAddon(fit);terminal.loadAddon(search);terminal.open(document.getElementById('terminal'));
const keywordHighlights=MacTermHighlights.connect(terminal);window.applyKeywordHighlights=value=>keywordHighlights.apply(value);if(window.initialKeywordHighlights)window.applyKeywordHighlights(window.initialKeywordHighlights);
const recordingSupported=MacTermInteraction.connect(terminal,message=>window.webkit.messageHandlers.bridge.postMessage(message));terminal.onResize(size=>window.webkit.messageHandlers.bridge.postMessage({type:'resize',...size}));
window.applyTerminalPreferences=p=>MacTermPreferences.apply(terminal,fit,p);
if(window.initialTerminalPreferences)window.applyTerminalPreferences(window.initialTerminalPreferences);
window.receive=data=>terminal.write(Uint8Array.from(atob(data),c=>c.charCodeAt(0)));
window.focusTerminal=()=>{fit.fit();terminal.focus()};window.setFontSize=size=>{terminal.options.fontSize=Math.max(9,Math.min(32,size));fit.fit()};
window.showSearch=()=>{document.getElementById('search').style.display='block';document.getElementById('query').focus();document.getElementById('query').select()};
window.hideSearch=()=>{document.getElementById('search').style.display='none';search.clearDecorations();terminal.clearSelection();terminal.focus()};
function find(previous=false){const query=document.getElementById('query').value,result=document.getElementById('result');if(!query){result.textContent='';terminal.clearSelection();return}try{if(document.getElementById('regex').checked)new RegExp(query);const options={caseSensitive:document.getElementById('case').checked,regex:document.getElementById('regex').checked,wholeWord:document.getElementById('word').checked};result.textContent=(previous?search.findPrevious(query,options):search.findNext(query,options))?'已找到':'无匹配'}catch(error){result.textContent='无效正则'}}
document.getElementById('next').onclick=()=>find();document.getElementById('previous').onclick=()=>find(true);document.getElementById('close').onclick=hideSearch;document.getElementById('query').onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();find(event.shiftKey)}if(event.key==='Escape'){event.preventDefault();hideSearch()}};
document.addEventListener("keydown",event=>{if(event.key==="Escape" && document.getElementById("search").style.display==="block"){event.preventDefault();event.stopPropagation();hideSearch()}},true);
window.exportText=()=>{const buffer=terminal.buffer.normal;let text='';for(let i=0;i<buffer.length;i++){const line=buffer.getLine(i);if(!line)continue;const next=buffer.getLine(i+1);text+=line.translateToString(true)+(next?.isWrapped?'':'\n')}return text.replace(/\n+$/,'')+'\n'};
new ResizeObserver(()=>fit.fit()).observe(document.body);fit.fit();window.webkit.messageHandlers.bridge.postMessage({type:'ready',recordingSupported});
</script></body></html>
